name: Test pipeline E2E (temporary)

on:
  workflow_dispatch: {}  # manuel uniquement -- test ponctuel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt requests pandas matplotlib
      - name: Test E2E (OHLCV + jointure + graphiques + stats)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_collection/test_pipeline_e2e.py
      - name: Upload graphiques
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-charts
          path: pipeline_test_*.png
