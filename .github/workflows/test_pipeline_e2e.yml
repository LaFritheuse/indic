name: Test pipeline E2E (temporary)

on:
  workflow_dispatch: {}  # manuel uniquement -- test ponctuel

permissions:
  contents: write  # nécessaire pour committer les OHLCV/graphiques produits

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt requests pandas matplotlib pyarrow
      - name: Test E2E (OHLCV + jointure + graphiques + stats)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_collection/test_pipeline_e2e.py
      - name: Committer les OHLCV et graphiques produits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crypto_5m/*.parquet results/pipeline_test_*.png
          git diff --cached --quiet && echo "Rien de nouveau à committer." || git commit -m "Test E2E pipeline : OHLCV 5m + graphiques (automatique)"
          git push
