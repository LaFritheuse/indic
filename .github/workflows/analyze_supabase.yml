name: Analyze Supabase data (temporary)

on:
  workflow_dispatch: {}  # manuel uniquement -- outil de diagnostic ponctuel

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Analyser les données
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_collection/analyze_supabase_data.py
