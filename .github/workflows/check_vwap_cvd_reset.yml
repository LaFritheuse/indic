name: Check VWAP/CVD reset at UTC midnight (temporary)

on:
  workflow_dispatch: {}  # manuel uniquement -- diagnostic ponctuel

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Vérification reset VWAP/CVD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_collection/check_vwap_cvd_reset.py
