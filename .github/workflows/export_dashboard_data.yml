name: Export dashboard data snapshot

on:
  workflow_dispatch: {}  # manuel -- relancer pour rafraîchir le dashboard

permissions:
  contents: write  # pour committer dashboard/data.json

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Exporter les données
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_collection/export_dashboard_data.py
      - name: Committer le snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git diff --cached --quiet && echo "Rien de nouveau à committer." || git commit -m "Snapshot dashboard (automatique)"
          git push
