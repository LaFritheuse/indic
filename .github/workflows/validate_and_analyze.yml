name: Validate data & test exploitation (temporary)

on:
  workflow_dispatch: {}  # manuel uniquement -- diagnostic ponctuel

permissions:
  contents: write  # pour committer les graphiques/parquet produits

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt requests pandas matplotlib pyarrow numpy
      - name: Validation + analyse
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_collection/validate_and_analyze.py
      - name: Committer les graphiques et données produites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crypto_5m/*.parquet results/liq_spike_reaction_*.png results/oi_price_correlation_*.png
          git diff --cached --quiet && echo "Rien de nouveau à committer." || git commit -m "Validation + analyse funding/OI/liquidations (automatique)"
          git push
